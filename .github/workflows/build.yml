name: Auto Build and Update

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests customtkinter pillow pyinstaller supabase
          
      - name: Auto-increment Version
        run: |
          python -c "
          import json
          with open('version.json', 'r', encoding='utf-8') as f:
              data = json.load(f)
          
          v_parts = data['version'].split('.')
          major, minor, patch = int(v_parts[0]), int(v_parts[1]), int(v_parts[2])
          
          patch += 1
          data['version'] = f'{major}.{minor}.{patch}'
          data['release_notes'] = 'อัปเดตระบบอัตโนมัติผ่าน GitHub Actions'
          
          with open('version.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          print('Updated version successfully.')
          "

      - name: Build with PyInstaller
        run: |
          python -m PyInstaller --onefile --noconsole --clean --noconfirm --collect-all cryptography --collect-all pydantic --add-data "icons;icons" --add-data "version.json;." -n "RSRM-Asset" RSRM-Asset.py

      - name: Upload to Supabase Storage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python -c "
          import os
          from supabase import create_client
          url = os.environ.get('SUPABASE_URL')
          key = os.environ.get('SUPABASE_KEY')
          supabase = create_client(url, key)
          
          # 1. อัปโหลดไฟล์ .exe
          exe_path = 'dist/RSRM-Asset.exe'
          with open(exe_path, 'rb') as f:
              supabase.storage.from_('app-updates').upload('RSRM-Asset.exe', f, file_options={'upsert': 'true'})
          print('EXE uploaded successfully.')

          # 2. อัปโหลดไฟล์ version.json ที่ถูกเพิ่มเลขเวอร์ชันอัตโนมัติแล้วขึ้นไป
          json_path = 'version.json'
          with open(json_path, 'rb') as f:
              supabase.storage.from_('app-updates').upload('version.json', f, file_options={'upsert': 'true'})
          print('version.json uploaded successfully.')
          "