name: Auto Build and Update

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests customtkinter pillow pyinstaller supabase
          
      - name: Build with PyInstaller
        run: |
          python -m PyInstaller --onefile --noconsole --clean --noconfirm --collect-all cryptography --collect-all pydantic --add-data "icons;icons" -n "RSRM-Asset" RSRM-Asset.py

      - name: Upload to Supabase Storage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python -c "
          import os
          from supabase import create_client
          url = os.environ.get('SUPABASE_URL')
          key = os.environ.get('SUPABASE_KEY')
          supabase = create_client(url, key)
          
          exe_path = 'dist/RSRM-Asset.exe'
          with open(exe_path, 'rb') as f:
              supabase.storage.from_('app-updates').upload('RSRM-Asset.exe', f, file_options={'upsert': 'true'})
          print('EXE uploaded successfully.')
          "